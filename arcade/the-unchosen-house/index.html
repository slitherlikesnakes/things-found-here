<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>The Unchosen House — a tiny October story</title>
<style>
:root{--ink:#e8dfc8;--muted:#b8ad97;--gold:#e2bd77;--line:rgba(226,189,119,.25);--night:#0d131b;--card:#17212a;--shadow:#070a0f}
*{box-sizing:border-box}html{min-height:100%;background:var(--night)}body{margin:0;color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh;background:radial-gradient(ellipse at 50% 5%,#26303d 0%,#141c26 42%,#0c1119 80%);overflow-x:hidden}
button{font:inherit}button:focus-visible{outline:3px solid #ffdf9e;outline-offset:4px}.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#f9f1dc;opacity:.4;box-shadow:0 0 9px #fff6da;animation:twinkle 5s ease-in-out infinite alternate}.moon{position:absolute;right:11%;top:7%;width:93px;height:93px;border-radius:50%;background:#e9e0bd;box-shadow:0 0 34px #e6d3a73b,0 0 110px #e6d3a72a;opacity:.88}.moon:after{content:"";position:absolute;left:21px;top:-10px;width:87px;height:87px;border-radius:50%;background:#202a37}.hill{position:absolute;bottom:-15vh;left:-10vw;width:120vw;height:38vh;background:#0a1118;border-radius:50% 50% 0 0;opacity:.95}.hill.two{bottom:-23vh;left:22vw;background:#0d151d;transform:rotate(-4deg)}@keyframes twinkle{to{opacity:.9;transform:scale(1.5)}}
main{position:relative;z-index:1;max-width:970px;margin:0 auto;padding:42px 24px 72px}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--muted);font:11px/1.4 system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase}.mark{display:flex;gap:10px;align-items:center}.mark .sigil{font-size:22px;color:var(--gold)}.reset{border:1px solid var(--line);background:#111923b0;color:var(--muted);border-radius:100px;padding:9px 13px;font:11px system-ui,sans-serif;letter-spacing:.04em;cursor:pointer}.reset:hover{color:var(--ink);border-color:var(--gold)}.reset[hidden]{display:none}
header{text-align:center;margin:35px auto 15px;max-width:690px}h1{font-weight:normal;letter-spacing:-.045em;font-size:clamp(48px,9vw,91px);line-height:.94;margin:0;text-wrap:balance;text-shadow:0 5px 35px #0007}h1 em{color:var(--gold);font-weight:normal}header p{font-size:16px;color:var(--muted);font-style:italic;margin:20px 0 0}.rule{display:flex;align-items:center;justify-content:center;gap:18px;margin:28px auto 30px;color:var(--gold)}.rule:before,.rule:after{content:"";height:1px;width:min(25vw,150px);background:linear-gradient(90deg,transparent,var(--line))}.rule:after{transform:rotate(180deg)}
.panel{position:relative;max-width:780px;margin:auto;padding:clamp(22px,5vw,45px);background:linear-gradient(145deg,#1b2530e8,#111922f5);border:1px solid var(--line);border-radius:7px;box-shadow:0 25px 85px #0008,inset 0 0 0 6px #ffffff05;min-height:420px}.panel:before,.panel:after{content:'✦';position:absolute;color:#e2bd7777;font-size:14px}.panel:before{top:12px;left:14px}.panel:after{right:14px;bottom:12px}.chapter{font:11px/1.5 system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}.story{max-width:650px;margin:auto}.story h2{font-weight:normal;font-size:clamp(27px,5vw,42px);line-height:1.14;letter-spacing:-.025em;margin:0 0 17px}.story p{font-size:clamp(17px,2.4vw,20px);line-height:1.65;color:#d6cdbb;margin:0 0 17px}.story p.small{font-size:15px;color:var(--muted);font-style:italic}.story strong{color:#f6db9d;font-weight:normal}.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:27px}.door-choice{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;min-height:212px;padding:17px 10px 18px;background:#10192299;border:1px solid #a991663d;border-radius:5px;color:var(--ink);cursor:pointer;transition:transform .2s,background .2s,border-color .2s}.door-choice:hover{transform:translateY(-5px);background:#22303a;border-color:#e2bd77aa}.door-art{position:relative;width:70px;height:109px;border:3px solid currentColor;border-radius:36px 36px 3px 3px;box-shadow:inset 0 0 0 4px #111922,0 0 0 2px #090e15;opacity:.9}.door-art:after{content:'';position:absolute;right:10px;top:62px;width:6px;height:6px;background:var(--gold);border-radius:50%;box-shadow:0 0 10px var(--gold)}.door-art:before{content:'';position:absolute;left:12px;right:12px;top:17px;height:37px;border:1px solid currentColor;border-radius:20px 20px 2px 2px;opacity:.5}.door-choice.brass{color:#dcb47a}.door-choice.blue{color:#9dc6db}.door-choice.moss{color:#a4bf91}.door-name{font-size:18px;color:var(--ink)}.door-hint{font:12px/1.5 system-ui,sans-serif;color:var(--muted)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:28px}.choice{background:#182632;border:1px solid #9a87654d;color:var(--ink);text-align:left;padding:18px 20px;border-radius:5px;cursor:pointer;min-height:94px;transition:background .2s,border-color .2s}.choice:hover{background:#2b3942;border-color:var(--gold)}.choice b{display:block;font-size:18px;font-weight:normal;margin-bottom:6px}.choice span{font:12px/1.45 system-ui,sans-serif;color:var(--muted)}.single{grid-template-columns:1fr}.single .choice{text-align:center;min-height:auto}.keepsake{border:1px solid var(--line);border-radius:4px;background:#0e1820;margin:26px 0;padding:20px 22px;display:flex;align-items:center;gap:18px}.keepsake .symbol{font-size:37px;color:var(--gold);width:55px;text-align:center}.keepsake b{display:block;font-weight:normal;color:var(--gold);font-size:18px;margin-bottom:4px}.keepsake span{font:13px/1.5 system-ui,sans-serif;color:var(--muted)}.progress{display:flex;justify-content:center;gap:10px;margin:22px auto 0}.progress i{height:4px;width:36px;border-radius:4px;background:#e2bd7730}.progress i.active{background:var(--gold)}.footer{text-align:center;color:#9b9b91;font:11px/1.7 system-ui,sans-serif;margin:25px auto;max-width:560px}.footer button{background:none;border:0;color:#d7b77d;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}.note{font-size:13px!important;color:#bcae92!important}.end-ornament{font-size:42px;color:var(--gold);text-align:center;margin:15px 0 23px}.history{border-left:2px solid #d9b47770;padding-left:16px;color:#c9bba0!important;font-style:italic}.fade{animation:appear .45s ease-out}@keyframes appear{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:560px){main{padding:22px 15px 48px}.topline{font-size:9px}.moon{width:63px;height:63px;right:4%;top:6%}.moon:after{width:60px;height:60px;left:14px;top:-8px}header{margin-top:39px}.panel{padding:25px 20px}.doors{gap:7px}.door-choice{padding:13px 5px;min-height:193px}.door-art{width:49px;height:85px;border-radius:25px 25px 3px 3px}.door-art:before{left:8px;right:8px;top:13px;height:27px}.door-art:after{top:49px;right:6px}.door-name{font-size:16px}.door-hint{font-size:10px}.choices{grid-template-columns:1fr}.choice{min-height:70px;padding:14px 17px}.story p{font-size:17px}.keepsake{padding:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true" id="sky"><div class="moon"></div><div class="hill"></div><div class="hill two"></div></div>
<main>
<div class="topline"><div class="mark"><span class="sigil">✧</span><span>An October miniature</span></div><button class="reset" id="forget" hidden>Forget previous visits</button></div>
<header><h1>The <em>Unchosen</em><br>House</h1><p>A short story about the doors you leave closed.</p></header>
<div class="rule" aria-hidden="true">✧</div>
<section class="panel" id="panel" aria-live="polite" aria-atomic="true"></section>
<div class="progress" id="progress" aria-label="Story progress"></div>
<div class="footer">A small, self-contained story. Your choices can be remembered <em>only in this browser</em>; nothing is sent anywhere. <button id="about">How it remembers</button>.</div>
</main>
<script>
(()=>{'use strict';
const key='unchosen-house-v1';let history=[];try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))history=saved.filter(x=>x&&['brass','blue','moss'].includes(x.door)).slice(-12)}catch(e){}
const rooms={
brass:{name:'The brass door',hint:'Something is ticking.',title:'The Room of Almost-Tomorrows',symbol:'⌛',item:'a match that has never been struck',desc:'Inside, a thousand clocks are stopped at one minute before something important. One is set to the moment before a confession. One, to the instant before a train departed. A tiny clock on the windowsill has no hands at all.',options:[{name:'Wind the smallest clock',hint:'Some things deserve another chance.',tag:'courage',result:'You wind the handless clock. It chimes once, softly, and a single match appears in your palm. It is warm, although it has never burned.'},{name:'Leave the clocks alone',hint:'Not every moment needs repeating.',tag:'mercy',result:'You leave the clocks untouched. The silence becomes kinder. A single unstruck match appears in your palm, cool as the air before dawn.'}]},
blue:{name:'The blue door',hint:'Someone is listening.',title:'The Room of Unsent Messages',symbol:'✉',item:'a blue envelope with no address',desc:'The room is full of radios, none of them plugged in. Each is whispering a message someone composed and never sent. One says “I was wrong.” Another says “I kept the ticket.” A third is silent until you lean close.',options:[{name:'Listen to the silent radio',hint:'You might hear something meant for you.',tag:'curiosity',result:'The radio says nothing at first. Then: “You can begin again without calling the first attempt a failure.” Beside it lies a blue envelope, blank on both sides.'},{name:'Turn all the radios off',hint:'Silence is also an answer.',tag:'rest',result:'One by one, the voices fall quiet. The room exhales. A blue envelope slips from the last radio, carrying nothing you are obliged to answer.'}]},
moss:{name:'The moss door',hint:'Something is growing.',title:'The Greenhouse of Other Plans',symbol:'❀',item:'a seed in a paper sleeve',desc:'A greenhouse stretches much farther than the house could possibly contain. Every plant is labelled with a plan someone abandoned: LEARN THE VIOLIN, VISIT THE SEA, SAY YES. Some are flourishing. Some have become beautiful weeds.',options:[{name:'Open the jar on the shelf',hint:'There is a little light inside.',tag:'release',result:'A moth escapes the jar and immediately chooses the darkest corner of the greenhouse. You laugh despite yourself. A paper sleeve containing one seed is left behind.'},{name:'Water the smallest weed',hint:'It may never become what it was meant to be.',tag:'patience',result:'The weed grows one new leaf. Not a flower. Not a revelation. Just a leaf. Under its pot you find a paper sleeve holding one seed.'}]}}
let state={stage:0,door:null,action:null,echo:null};const panel=document.getElementById('panel'),progress=document.getElementById('progress'),forget=document.getElementById('forget');
function escape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem(key,JSON.stringify(history))}catch(e){}}
function button(cls,action,label,sub=''){return `<button class="${cls}" data-act="${action}"><b>${label}</b>${sub?`<span>${sub}</span>`:''}</button>`}
function draw(){let html='';forget.hidden=!history.length;progress.innerHTML=Array.from({length:4},(_,i)=>`<i class="${i<=state.stage?'active':''}"></i>`).join('');
if(state.stage===0){html=`<div class="chapter">I · The threshold</div><div class="story"><h2>At the end of the street is a house with three front doors.</h2><p>There is no number on the gate. No lights in the windows. A little brass plaque reads:</p><p><strong>WE KEEP WHAT WAS NOT CHOSEN.</strong></p><p>You can enter by only one door. The other two will remember that you didn't.</p>${history.length?`<p class="small">The house seems to recognize your footsteps. You have been here before.</p>`:''}<div class="doors">${Object.entries(rooms).map(([id,r])=>`<button class="door-choice ${id}" data-act="door:${id}" aria-label="Enter ${r.name}"><span class="door-art" aria-hidden="true"></span><span class="door-name">${r.name}</span><span class="door-hint">${r.hint}</span></button>`).join('')}</div></div>`}
if(state.stage===1){const r=rooms[state.door];html=`<div class="chapter">II · Beyond the ${state.door} door</div><div class="story"><h2>${r.title}</h2><p>${r.desc}</p><p>There are two things you could do. No one is watching to see which is better.</p><div class="choices">${r.options.map((o,i)=>button('choice',`action:${i}`,escape(o.name),escape(o.hint))).join('')}</div></div>`}
if(state.stage===2){const r=rooms[state.door],o=r.options[state.action];const others=Object.entries(rooms).filter(([id])=>id!==state.door);html=`<div class="chapter">III · What you carry</div><div class="story"><h2>The house gives you something small.</h2><p>${o.result}</p><div class="keepsake"><div class="symbol">${r.symbol}</div><div><b>${r.item}</b><span>It fits in your pocket. It does not explain itself.</span></div></div><p>Back in the hall, the other two doors are gone. In their place are two shadows, each holding something that might have been yours.</p><p>There is room in your other pocket for <strong>one</strong> of them.</p><div class="choices">${others.map(([id,room])=>button('choice',`echo:${id}`,`Keep the echo of ${room.name.toLowerCase()}`,id==='brass'?'A moment that could still change.':id==='blue'?'A message nobody demanded.':'A plan that grew without you.')).join('')}</div></div>`}
if(state.stage===3){const r=rooms[state.door],echo=rooms[state.echo];const endings={brass:'On the pavement, a streetlight flickers like a clock trying to decide whether to move forward.',blue:'Outside, a distant radio plays static, and for once you do not need to decipher it.',moss:'In the crack beside the gate, a small green thing has grown without permission.'};const prev=history.length>1?history[history.length-2]:null;const previousLine=prev&&prev.door!==state.door?`Last time you came here, you chose ${rooms[prev.door].name.toLowerCase()}. Tonight, that door remained closed. Nothing terrible happened.`:prev?'You chose the same door on another visit. The room was not disappointed to see you again.':'';html=`<div class="chapter">IV · The way out</div><div class="story"><h2>The house does not ask whether you chose correctly.</h2><p>You leave carrying <strong>${r.item}</strong> and the faint echo of <strong>${echo.name.toLowerCase()}</strong>.</p><p>${endings[state.door]}</p><p>Behind you, the three doors become one ordinary front door. There is a number on it now, but when you look away, you forget what it was.</p><p class="history">${previousLine||'Perhaps you will come back. Perhaps you won’t. The house is good at keeping both possibilities.'}</p><div class="end-ornament" aria-hidden="true">✧</div><p class="small">Nothing here was a test. You were allowed to leave the other doors closed.</p><div class="choices single">${button('choice','restart','Visit the house again','The rooms may recognize your footsteps.')}</div></div>`}
panel.innerHTML=`<div class="fade">${html}</div>`;}
function handle(act){if(act.startsWith('door:')&&state.stage===0){state.door=act.slice(5);state.stage=1}else if(act.startsWith('action:')&&state.stage===1){state.action=Number(act.slice(7));state.stage=2}else if(act.startsWith('echo:')&&state.stage===2){state.echo=act.slice(5);history.push({door:state.door,action:state.action,echo:state.echo});history=history.slice(-12);save();state.stage=3}else if(act==='restart'&&state.stage===3){state={stage:0,door:null,action:null,echo:null}}else{return}draw();panel.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});}
panel.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)handle(b.dataset.act)});
forget.addEventListener('click',()=>{history=[];try{localStorage.removeItem(key)}catch(e){};draw()});document.getElementById('about').addEventListener('click',()=>{alert('This page stores up to 12 previous door choices using localStorage in this browser only. It does not send information to a server. Use “Forget previous visits” to erase them. If your browser blocks storage, the story still works without remembering.')});
let seed=77;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const sky=document.getElementById('sky');for(let i=0;i<47;i++){const s=document.createElement('i');s.className='star';s.style.left=(rand()*100)+'%';s.style.top=(rand()*66)+'%';s.style.animationDelay=(-rand()*7)+'s';s.style.animationDuration=(3+rand()*6)+'s';sky.appendChild(s)}draw();
})();
</script>
</body></html>
